<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Optimasi Menu MBG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Optimasi Menu MBG</h1>

  <div class="card">
    <h2>Pilih Kategori</h2>

    <select id="kategori">
      <option value="kecil">Porsi Kecil</option>
      <option value="besar">Porsi Besar</option>
    </select>

    <button onclick="optimasiMenu()">
      Optimasi Menu
    </button>
  </div>


  <div class="card">
    <h2>Data Menu MBG</h2>

    <table>
      <thead>
        <tr>
          <th rowspan="2">Minggu</th>
          <th rowspan="2">Hari/Tanggal</th>
          <th rowspan="2">Menu</th>
          <th colspan="2">Harga/Porsi</th>
          <th colspan="2">Gizi/Porsi</th>
        </tr>
        <tr>
          <th>Kecil</th>
          <th>Besar</th>
          <th>Kecil</th>
          <th>Besar</th>
        </tr>
      </thead>

      <tbody id="menuTable"></tbody>
    </table>
  </div>


  <div class="card">
    <h2>Variabel Keputusan</h2>

    <table>
      <thead>
        <tr>
          <th>Variabel</th>
          <th>Definisi</th>
          <th>Menu</th>
        </tr>
      </thead>

      <tbody id="variabelTable"></tbody>
    </table>
  </div>


  <div class="card">
    <h2>Hasil Optimasi</h2>
    <div id="hasil"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
